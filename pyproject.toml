[project]
name = "multiagent-dev-assistant"
version = "0.1.0"
description = "仓库级智能研发助手：多 Agent 协同 + 双层记忆 + 工具体系 + 评测 harness（CLI）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Huggins" }]
dependencies = []

[project.scripts]
devassist = "app.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "data",
    "sample_repo",
    "suites",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501", # line length handled by formatter where needed
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
